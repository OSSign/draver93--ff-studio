
name: Sign release

run-name: "Sign ${{ inputs.ref }} [${{ inputs.dispatch_id }}]"      # [DO NOT CHANGE]

on:                                                                 # [DO NOT CHANGE] all four inputs
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag of the source repository as requested
        required: true
      sha:
        description: Commit pinned by ossign-server; the build uses this, never the moving ref
        required: true
      release_name:
        description: Name of the GitHub release to publish
        required: true
      dispatch_id:
        description: Dispatch id assigned by ossign-server
        required: true

env:
  # [DO NOT CHANGE] Repository variables. SOURCE_REPO and OSSIGN_SERVER are set
  # automatically during onboarding; add OSSIGN_KEY (the key name on the
  # server) under Settings → Secrets and variables → Actions → Variables.
  SOURCE_REPO: ${{ vars.SOURCE_REPO }}
  OSSIGN_SERVER: ${{ vars.OSSIGN_SERVER }}
  OSSIGN_KEY: ${{ vars.OSSIGN_KEY }}

# [DO NOT CHANGE] id-token: write gives the job its OIDC token (signing and the report fetch).
# contents: write is only needed by the release step at the bottom.
permissions:
  contents: write
  id-token: write

jobs:
  # The review scans the pinned commit on the server (the ossign-scanner
  # service) before this job's environment is released, so the workflow has
  # no scanning job of its own. Which scanners run is part of the review
  # rule, not of this file.

  sign:
    runs-on: windows-latest                                      # [CHANGE ME] NSIS installers build on Windows
    environment: signing                                         # [DO NOT CHANGE]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the pinned source commit                 # [DO NOT CHANGE]
        run: |
          git init src
          cd src
          git remote add origin "$SOURCE_REPO"
          git fetch --depth 1 origin "${{ inputs.sha }}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
      
      - name: Install Tauri CLI and update config
        run: |
          cd src
          ls -la src-tauri/
          sed -i 's/"linux": {/"windows": {"signCommand": "ossign.exe -t auto %1"}, "linux": {/' src-tauri/tauri.conf.json
          cargo install tauri-cli
      
      # [DO NOT CHANGE] Install the CLI and write its configuration once. Nothing is
      # signed here; electron-builder does that through the hook below. The
      # config lands in the user's ossign config directory, which the CLI reads
      # by default, so the hook needs no path. This step and every later ossign
      # call still need the OIDC token, i.e. id-token: write on the job.
      - name: Install ossign
        id: ossign
        uses: ossign/ossign@1.3.1
        with:
          installOnly: true
          config: |
            { "tokenType": "ossignServer",
              "ossignServer": { "url": "${{ env.OSSIGN_SERVER }}", "key": "${{ env.OSSIGN_KEY }}",
                                "metadata": { "dispatch": "${{ inputs.dispatch_id }}", "sha": "${{ inputs.sha }}" } } }
      

      - name: Build
        working-directory: ./src/src-tauri
        run: cargo tauri build

      - name: Rename and create checksums and sign files
        shell: powershell
        run: |
          $ver = $(Get-Content ./src/src-tauri/Cargo.toml | Select-String -Pattern '^version\s*=' | ForEach-Object { ($_ -split '= "')[1] -replace '"', '' })
          $target = "x86_64-pc-windows-msvc"

          # Rename and checksum MSI
          $msi = Get-ChildItem ./src/src-tauri/target/release/bundle/msi/* -ErrorAction SilentlyContinue
          if ($msi) {
            $msiName = "ffstudio-$ver-$target.msi"
            Move-Item $msi.FullName $msiName
            (Get-FileHash $msiName -Algorithm SHA256 | Select-Object -ExpandProperty Hash) + "  " + $msiName | Out-File "$msiName.sha256" -Encoding ASCII
            ossign.exe -t msi $msiName
          }

          # Rename and checksum NSIS installer
          $nsis = Get-ChildItem ./src/src-tauri/target/release/bundle/nsis/* -ErrorAction SilentlyContinue
          if ($nsis) {
            $nsisName = "ffstudio-$ver-$target-setup.exe"
            Move-Item $nsis.FullName $nsisName
            (Get-FileHash $nsisName -Algorithm SHA256 | Select-Object -ExpandProperty Hash) + "  " + $nsisName | Out-File "$nsisName.sha256" -Encoding ASCII
            ossign.exe -t pecoff $nsisName
          }

      
      # [RECOMMENDED] Fetch the review report bundle (available once the review
      # is decided, which it is by the time this job runs) so it can be
      # published next to the binaries: review-report.json (full report),
      # review-report.md (summary, used as the release body),
      # review-scans.zip (raw scanner output) and review-report.json.p7s
      # (detached signature over the JSON, made with this repository's key).
      - name: Fetch the review report
        run: |
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OSSIGN_SERVER" | jq -r .value)
          mkdir -p review
          for f in review-report.json review-report.md review-scans.zip review-report.json.p7s; do
            curl -sS --fail -H "Authorization: Bearer $OIDC" -o "review/$f" \
              "$OSSIGN_SERVER/api/v1/reviews/${{ inputs.dispatch_id }}/report/$f"
          done

      - name: Publish release                                    # [OPTIONAL] report summary as body, report files attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref }}-${{ github.run_number }}
          name: ${{ inputs.release_name }}
          body_path: review/review-report.md
          files: |
            *.msi
            *.exe
            *.sha256
            *.zip
